name: Climate Reanalyzer integration check
on:
  push:
    branches: [automatic-display-refresh]
    paths: ['scripts/**', 'assets/**', 'index.html', 'tests/**', '.github/workflows/reanalyzer-check.yml']
permissions:
  contents: write
concurrency:
  group: reanalyzer-integration-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calendar and source contract tests
        run: |
          python -m unittest discover -s tests -p test_reanalyzer.py
          node --check assets/js/reanalyzer.js
          node --check assets/js/auto-refresh.js
          node --check assets/js/app.js
          node --check assets/js/workbench.js
      - name: Browser checks and screenshots
        run: |
          pip -q install playwright
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
          python tests/check_reanalyzer_browser.py
          python tests/check_auto_refresh_browser.py
      - name: Retain review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reanalyzer-review
          path: review/
