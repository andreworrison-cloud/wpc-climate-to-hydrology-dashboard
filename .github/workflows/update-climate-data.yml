name: Update climate data

on:
  workflow_dispatch:
  schedule:
    # Daily source check. RONI itself is normally updated monthly by NOAA/CPC.
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live NOAA/CPC RONI
        run: python scripts/update_climate_data.py
      - name: Validate dashboard interfaces
        run: python scripts/validate_data.py
      - name: Commit refreshed data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update live RONI climate data"
          git push
